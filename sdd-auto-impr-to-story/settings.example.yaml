# Copy to settings.yaml and fill in your Jira / Bitbucket values.
# Do not put tokens here. Jira and Bitbucket go through the agent's MCP servers.

# Optional: only used to print browse URLs in the report.
jira:
  base_url: https://jira.example.com

# Пункт 1: какие задачи искать (пространство, тип, метка, статус)
source:
  project: IMPR          # пространство / project key
  issue_type: Improvement
  label: ready-for-sdd
  status: To Do

# Пункт 2: какую задачу создавать по каждой найденной
story:
  project: DEV
  issue_type: Story
  label: sdd-story
  status: To Do
  link_type: Relates     # связь Story ↔ исходная Improvement
  summary_pattern: "{source_key}: {source_summary}"
  done_status: Сделан                      # после merge кода (C6)

# Репозиторий спек (этапы A и B): BR/FR и спека кода
bitbucket:
  repository: https://bitbucket.org/workspace/specs.git
  default_branch: main
  source_branch_pattern: "feature/{key}"   # ветка Improvement
  story_branch_pattern: "feature/{key}"    # ветка Story
  task_branch_pattern: "feature/{key}"     # ветка таски компонента (этап B)

# Репозиторий компонента (этап C): генерация кода
component:
  repository: https://bitbucket.org/workspace/payments.git
  default_branch: master                   # мастер-ветка репы компонента
  task_branch_pattern: "task/{key}"
  story_branch_pattern: "feature/{key}"    # ветка Story в репе компонента

# Связанная задача / таска компонента
related:
  issue_type: Task
  link_type: Relates
  component: backend
  component_from_source: true
  # project: DEV
  label: sdd-impl
  status: To Do
  summary_pattern: "[{component}] {story_key}: {story_summary}"
  in_progress_status: В работе             # после merge спеки кода (B4)
  done_status: Сделан                      # после merge кода (C5)

# После merge BR/FR (пункт 8): Improvement в работу
after_merge:
  statuses:
    - В работе
    - In Progress

# После merge кода (C7): финальный статус Improvement
improvement_done:
  statuses:
    - Сделан
    - Done

openspec:
  capabilities:
    - business-requirements
    - functional-requirements
  change_id_pattern: "{source_key}"
  implementation_capability: code-changes
  implementation_change_id_pattern: "{task_key}"

limits:
  max_issues: 20
