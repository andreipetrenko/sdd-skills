# Copy to settings.yaml and fill in your Jira values.
# Do not put tokens here. Jira goes through the agent's MCP server.

# Optional: only used to print browse URLs in the report.
jira:
  base_url: https://jira.example.com

# Пункт 1: какой Epic/задачу релиза искать (пространство, тип, метка, статус)
source:
  project: REL           # пространство / project key
  issue_type: Epic       # или Task
  label: release
  status: In Progress

# Пункты 2–3: какие Story относятся к релизу и какой у них ready-статус
stories:
  issue_type: Story
  via: both              # parent | linked | both
  # link_type: Relates
  # project: DEV
  # не ставь status: Ready for UAT — иначе поиск скроет неготовые Story
  ready_status: Ready for UAT

# Пункт 4: куда переводить Epic/задачу, если все Story ready
target:
  statuses:
    - Ready for UAT

limits:
  max_issues: 20
  max_stories: 100
